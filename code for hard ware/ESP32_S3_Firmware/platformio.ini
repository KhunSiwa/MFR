[platformio]
default_envs = esp32_s3_sim

[env:esp32_s3_sim]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MFR_SIMULATION_DEFAULT=1
  -D MFR_PHYSICAL_OUTPUTS_ENABLED=0
  -D MFR_ZKBM1_MAX_PWM_HZ=2000
lib_deps =
  bblanchon/ArduinoJson @ ^7.1.0

[env:esp32_s3_bench]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Only enable MFR_PHYSICAL_OUTPUTS_ENABLED=1 AFTER completing all [CHECK] items
; in HARDWARE_WIRING_GUIDE.md and verifying supply rails & common star ground.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MFR_SIMULATION_DEFAULT=1
  -D MFR_PHYSICAL_OUTPUTS_ENABLED=0
  -D MFR_ZKBM1_MAX_PWM_HZ=2000
lib_deps =
  bblanchon/ArduinoJson @ ^7.1.0

[env:native_test]
platform = native
build_flags =
  -std=c++17
  -D MFR_NATIVE_HOST_SIM=1
  -D MFR_PHYSICAL_OUTPUTS_ENABLED=0
  -D MFR_ZKBM1_MAX_PWM_HZ=2000

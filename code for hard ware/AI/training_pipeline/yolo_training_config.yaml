# MFR Production Target YOLOv8 Hyperparameter Configuration
# STATUS: TARGET SPECIFICATION ONLY — NOT EXECUTED ON THIS HOST
# Reason: ultralytics and torchvision are ABSENT in the local Python environment,
# and 0 real labeled facade defect images exist in source/photos_PLACEHOLDER/.

task: detect
mode: train
model: yolov8n.pt   # Target lightweight edge backbone (pending ultralytics + real dataset)
data: /Users/Siwakorn/Downloads/mfr/MFR_MASTER/06_AI_COMPUTER_VISION/dataset_spec/dataset.yaml

# Input & Optimization
imgsz: 640
epochs: 100
batch: 16
optimizer: AdamW
lr0: 0.002
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 20
seed: 42
deterministic: true

# Facade-Safe Augmentations (preserve vertical drip orientation: flipud=0.0!)
hsv_h: 0.015
hsv_s: 0.4
hsv_v: 0.35
degrees: 5.0
translate: 0.08
scale: 0.35
shear: 0.0
perspective: 0.0005
flipud: 0.0        # Water stains & gravity drips are vertically directional
fliplr: 0.5
mosaic: 0.5
mixup: 0.0

# Governance Metadata
mfr_advisory_only: true
mfr_safety_actuation_allowed: false
